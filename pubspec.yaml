name: fuelwise
description: "FuelWise - Find the cheapest fuel and save money"
publish_to: 'none'

version: 1.0.2+12

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  shared_preferences: ^2.2.2
  google_maps_flutter: ^2.5.0
  url_launcher: ^6.2.2
  
  # Monetization
  google_mobile_ads: ^5.2.0
  purchases_flutter: ^8.2.3  # UPDATED to latest
  
  # Premium features
  firebase_core: ^3.8.1  # UPDATED to latest
  cloud_firestore: ^5.6.1  # UPDATED to latest
  flutter_local_notifications: ^18.0.1  # UPDATED to latest
  fl_chart: ^0.69.0  # UPDATED to latest
  
  # State management
  provider: ^6.1.2
  
  # Utilities
  intl: ^0.19.0
  package_info_plus: ^8.0.0  # Read version from pubspec at runtime

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true